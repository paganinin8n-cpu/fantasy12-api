name: Diagnose entity lookup

on:
  workflow_dispatch:
    inputs:
      entity_id:
        required: true
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Lookup entity
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENTITY_ID: ${{ inputs.entity_id }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          envs: ENTITY_ID
          script: |
            set -eu
            API_CONTAINER="$(docker ps --filter 'name=f12-prd_api' --format '{{.ID}}' | head -n 1)"
            test -n "$API_CONTAINER"
            docker exec -e ENTITY_ID="$ENTITY_ID" -i "$API_CONTAINER" node <<'NODE'
            const { prisma } = require('/app/dist/lib/prisma')
            async function main() {
              const id = process.env.ENTITY_ID
              const [ranking, participant, invite, audit, user] = await Promise.all([
                prisma.ranking.findUnique({ where: { id }, select: { id: true, name: true, type: true, status: true } }),
                prisma.rankingParticipant.findUnique({
                  where: { id },
                  select: {
                    id: true, rankingId: true, userId: true, score: true, scoreInitial: true, status: true,
                    ranking: { select: { id: true, name: true, type: true, status: true } },
                    user: { select: { nickname: true, name: true } },
                  },
                }),
                prisma.bolaoInvite.findFirst({
                  where: { OR: [{ id }, { code: id }] },
                  select: { id: true, code: true, rankingId: true, ranking: { select: { id: true, name: true, status: true } } },
                }),
                prisma.auditLog.findMany({
                  where: { OR: [{ entityId: id }, { userId: id }] },
                  select: { action: true, entity: true, entityId: true, userId: true, createdAt: true, metadata: true },
                  orderBy: { createdAt: 'desc' },
                  take: 20,
                }),
                prisma.user.findUnique({ where: { id }, select: { id: true, nickname: true, name: true, email: true } }),
              ])
              const bolaoes = await prisma.ranking.findMany({
                where: { type: 'BOLAO' },
                select: { id: true, name: true, status: true, startDate: true, endDate: true, createdAt: true, currentParticipants: true },
                orderBy: { createdAt: 'desc' },
                take: 30,
              })
              console.log(JSON.stringify({ id, ranking, participant, invite, user, audits: audit, recentBoloes: bolaoes }, null, 2))
            }
            main().catch(e => { console.error(e); process.exitCode = 1 }).finally(() => prisma.$disconnect())
            NODE
