name: CI/CD API

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fantasy12-api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  EASYPANEL_PROJECT: f12-prd
  EASYPANEL_SERVICE: api
  EASYPANEL_CODE_DIR: /etc/easypanel/projects/f12-prd/api/code
  API_HEALTH_URL: ${{ vars.API_HEALTH_URL || 'https://api.fantasy12.com/health' }}

jobs:
  ci:
    name: Build and release checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run CI checks
        run: npm run ci:check

      - name: Publish security gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-gates-${{ github.sha }}
          path: .artifacts/security-gates.json
          if-no-files-found: error
          retention-days: 30

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t "fantasy12-api:${GITHUB_SHA}" .

      - name: Verify container hardening
        run: sh scripts/verify-container-hardening.sh "fantasy12-api:${GITHUB_SHA}"

      - name: Scan production image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${HOME}/.cache/trivy:/root/.cache/" \
            aquasec/trivy:0.65.0 image \
            --exit-code 1 \
            --ignore-unfixed=false \
            --pkg-types os,library \
            --severity HIGH,CRITICAL \
            "fantasy12-api:${GITHUB_SHA}"

  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ci, docker-build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package release source
        run: |
          set -euo pipefail
          RELEASE_VERSION="$(node scripts/release-fingerprint.js)"
          printf '%s\n' "$RELEASE_VERSION" > .release-version
          printf 'RELEASE_VERSION=%s\n' "$RELEASE_VERSION" >> "$GITHUB_ENV"
          mkdir -p .release
          tar --exclude-from=.deployignore -czf ".release/fantasy12-api-${GITHUB_SHA}.tgz" .

      - name: Upload release package to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          source: ".release/fantasy12-api-${{ github.sha }}.tgz"
          target: /tmp
          strip_components: 1

      - name: Sync release into EasyPanel code directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          script: |
            set -eu
            RELEASE="/tmp/fantasy12-api-${{ github.sha }}.tgz"
            STAGE="/tmp/fantasy12-api-${{ github.sha }}"
            CODE_DIR="${{ env.EASYPANEL_CODE_DIR }}"

            rm -rf "$STAGE"
            mkdir -p "$STAGE" "$CODE_DIR"
            tar -xzf "$RELEASE" -C "$STAGE"

            if command -v rsync >/dev/null 2>&1; then
              rsync -a --delete \
                --exclude '.env' \
                --exclude '.env.*' \
                --exclude 'node_modules' \
                --exclude 'dist' \
                "$STAGE"/ "$CODE_DIR"/
            else
              find "$CODE_DIR" -mindepth 1 -maxdepth 1 \
                ! -name '.env' \
                ! -name '.env.local' \
                -exec rm -rf {} +
              cp -a "$STAGE"/. "$CODE_DIR"/
            fi

            if [ ! -s "$CODE_DIR/.release-version" ]; then
              echo "Synced release marker is missing" >&2
              exit 1
            fi

            rm -rf "$STAGE" "$RELEASE"
            echo "Release source synced to $CODE_DIR"

      - name: Preflight production and apply database migrations
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          script: |
            set -eu
            CODE_DIR="${{ env.EASYPANEL_CODE_DIR }}"
            API_CONTAINER="$(docker ps --filter 'name=f12-prd_api' --format '{{.ID}}' | head -n 1)"
            STAGED_PRISMA="/tmp/fantasy12-prisma-${{ github.sha }}-${{ github.run_attempt }}"
            MIGRATION_BACKUP="/tmp/fantasy12-migration-history-v1-${{ github.run_id }}-${{ github.run_attempt }}.json"
            BASELINE_MIGRATION="20260730000000_fantasy12_baseline_v2"

            if [ -z "$API_CONTAINER" ]; then
              echo "Active Fantasy12 API container not found" >&2
              exit 1
            fi

            docker cp "$CODE_DIR/scripts/preflight-production-deploy.js" "$API_CONTAINER:/app/scripts/preflight-production-deploy.js"
            docker exec "$API_CONTAINER" node /app/scripts/preflight-production-deploy.js
            docker exec "$API_CONTAINER" mkdir -p "$STAGED_PRISMA"
            docker cp "$CODE_DIR/prisma/." "$API_CONTAINER:$STAGED_PRISMA/"
            docker cp "$CODE_DIR/scripts/rebaseline-migration-history.js" "$API_CONTAINER:/app/scripts/rebaseline-migration-history.js"
            set +e
            docker exec \
              -e "ALLOW_MIGRATION_BASELINE_CUTOVER=$BASELINE_MIGRATION" \
              -e "MIGRATION_BASELINE_DIR=$STAGED_PRISMA/migrations" \
              -e "MIGRATION_BASELINE_MANIFEST=$STAGED_PRISMA/migration-baseline-cutover-v2.json" \
              -e "MIGRATION_HISTORY_BACKUP_PATH=$MIGRATION_BACKUP" \
              "$API_CONTAINER" \
              node /app/scripts/rebaseline-migration-history.js
            CUTOVER_STATUS=$?
            set -e

            mkdir -p /var/backups/fantasy12/migration-history
            if docker exec "$API_CONTAINER" test -s "$MIGRATION_BACKUP"; then
              docker cp \
                "$API_CONTAINER:$MIGRATION_BACKUP" \
                "/var/backups/fantasy12/migration-history/"
            fi

            if [ "$CUTOVER_STATUS" -ne 0 ]; then
              echo "Migration cutover diagnostic backup:"
              docker exec "$API_CONTAINER" cat "$MIGRATION_BACKUP" || true
              exit "$CUTOVER_STATUS"
            fi

            docker exec "$API_CONTAINER" \
              ./node_modules/.bin/prisma migrate deploy \
              --schema "$STAGED_PRISMA/schema.prisma"
            docker exec "$API_CONTAINER" \
              ./node_modules/.bin/prisma migrate status \
              --schema "$STAGED_PRISMA/schema.prisma"

      - name: Trigger EasyPanel deploy
        env:
          EASYPANEL_URL: ${{ secrets.EASYPANEL_URL }}
          EASYPANEL_EMAIL: ${{ secrets.EASYPANEL_EMAIL }}
          EASYPANEL_PASSWORD: ${{ secrets.EASYPANEL_PASSWORD }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const required = ['EASYPANEL_URL', 'EASYPANEL_EMAIL', 'EASYPANEL_PASSWORD']
          for (const name of required) {
            if (!process.env[name]) throw new Error(`${name} is required`)
          }

          const base = process.env.EASYPANEL_URL.replace(/\/$/, '')

          async function rpc(path, json, token) {
            const response = await fetch(`${base}${path}`, {
              method: 'POST',
              headers: {
                'content-type': 'application/json',
                ...(token ? { authorization: `Bearer ${token}` } : {}),
              },
              body: JSON.stringify({ json }),
            })

            const text = await response.text()
            let body
            try {
              body = text ? JSON.parse(text) : {}
            } catch {
              body = { raw: text }
            }

            if (!response.ok) {
              throw new Error(`RPC ${path} failed with ${response.status}: ${text}`)
            }

            if (body?.error) {
              const message = body.error?.message || 'unknown application error'
              throw new Error(`RPC ${path} was rejected: ${message}`)
            }

            return body
          }

          const login = await rpc('/api/rpc/auth/login', {
            email: process.env.EASYPANEL_EMAIL,
            password: process.env.EASYPANEL_PASSWORD,
            rememberMe: false,
          })

          const token = login?.json?.token
          if (!token) throw new Error('EasyPanel login did not return a token')

          await rpc('/api/rpc/services/app/deployService', {
            projectName: process.env.EASYPANEL_PROJECT || 'f12-prd',
            serviceName: process.env.EASYPANEL_SERVICE || 'api',
          }, token)

          console.log('EasyPanel deploy requested.')
          NODE

      - name: Wait for healthy API
        run: |
          set -euo pipefail
          echo "Waiting for $API_HEALTH_URL to serve release $RELEASE_VERSION"
          for i in $(seq 1 36); do
            HEALTH_RESPONSE="$(curl -fsS --max-time 10 "$API_HEALTH_URL" || true)"
            if printf '%s' "$HEALTH_RESPONSE" | grep -q '"api":"ok"' \
              && printf '%s' "$HEALTH_RESPONSE" | grep -q '"db":"ok"' \
              && printf '%s' "$HEALTH_RESPONSE" | grep -q "\"version\":\"$RELEASE_VERSION\""; then
              echo "API release $RELEASE_VERSION is healthy."
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for healthy API."
          exit 1

      - name: Verify production runtime hardening
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          script: |
            set -eu
            API_CONTAINER="$(docker ps --filter 'name=f12-prd_api' --format '{{.ID}}' | head -n 1)"
            test -n "$API_CONTAINER"
            test "$(docker exec "$API_CONTAINER" id -u)" -ne 0
            test "$(docker exec "$API_CONTAINER" node -p 'process.versions.node.split(".")[0]')" = '22'
            docker exec "$API_CONTAINER" test -f /app/dist/index.js
            docker exec "$API_CONTAINER" test -f /app/dist/worker.js
            docker exec "$API_CONTAINER" test -x /app/node_modules/.bin/prisma
            docker exec "$API_CONTAINER" test ! -e /usr/local/bin/npm
            docker exec "$API_CONTAINER" test ! -e /usr/local/bin/npx
            docker exec "$API_CONTAINER" ./node_modules/.bin/prisma version
            docker exec "$API_CONTAINER" node -e '
              require("@prisma/client")
              require("prisma/package.json")
              for (const name of ["typescript", "ts-node-dev", "pino-pretty"]) {
                try {
                  require.resolve(name)
                  throw new Error(`${name} must not exist in production`)
                } catch (error) {
                  if (error.code !== "MODULE_NOT_FOUND") throw error
                }
              }
            '
            echo 'Production container hardening verified.'
