name: Repair closed mesa scores

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type REPAIR to recompute CLOSED mesa participant scores
        required: true
        type: string

permissions:
  contents: read

jobs:
  repair:
    name: Repair CLOSED mesa scores
    if: inputs.confirmation == 'REPAIR'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Dry-run then apply score repair in API container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          script: |
            set -eu
            API_CONTAINER="$(docker ps --filter 'name=f12-prd_api' --format '{{.ID}}' | head -n 1)"

            if [ -z "$API_CONTAINER" ]; then
              echo "Active Fantasy12 API container not found" >&2
              exit 1
            fi

            echo "=== DRY RUN ==="
            docker exec "$API_CONTAINER" node /app/scripts/repair-closed-bolao-scores.js

            echo "=== APPLY ==="
            docker exec "$API_CONTAINER" node /app/scripts/repair-closed-bolao-scores.js --apply
